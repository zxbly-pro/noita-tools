name: Build & Package

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Build console worker
        run: npm run console-build

      - name: Pack Node.js deployment
        run: bash ./scripts/pack-node.sh

      - name: Pack nginx deployment
        run: bash ./scripts/pack-nginx.sh

      - name: Upload Node.js package
        uses: actions/upload-artifact@v4
        with:
          name: noitool-node
          path: scripts/noitool-node.tar.gz

      - name: Upload nginx package
        uses: actions/upload-artifact@v4
        with:
          name: noitool-nginx
          path: scripts/noitool-nginx.tar.gz

      - name: Upload worker build
        uses: actions/upload-artifact@v4
        with:
          name: noitool-worker
          path: console-build/
